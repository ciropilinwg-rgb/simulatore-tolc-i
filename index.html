<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Simulatore TOLC-I per esercitarsi con quiz a risposta multipla, selezione per materia, risultati dettagliati e revisione degli errori." />
    <title>Simulatore TOLC-I</title>
    <script>
      if (window.location.protocol === 'file:') {
        const normalizedPath = window.location.pathname.replace(/\\/g, '/');
        const isBuiltIndex = /\/dist\/index\.html$/i.test(normalizedPath);

        if (!isBuiltIndex) {
          const portableBuildUrl = new URL('./dist/index.html', window.location.href);
          window.location.replace(portableBuildUrl.href);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
