<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" class="graph-svg" aria-label="Grafico cartesiano">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f0f0f5" />
    </marker>
  </defs>
  <!-- Background panel -->
  <rect width="160" height="160" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  
  <!-- Assi cartesiani Oxy -->
  <!-- Asse X -->
  <line x1="15" y1="80" x2="145" y2="80" stroke="#a0a0bf" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="145" y="96" fill="#f0f0f5" font-family="'Inter', sans-serif" font-size="13" font-style="italic">x</text>
  
  <!-- Asse Y -->
  <line x1="80" y1="145" x2="80" y2="15" stroke="#a0a0bf" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="68" y="24" fill="#f0f0f5" font-family="'Inter', sans-serif" font-size="13" font-style="italic">y</text>
  
  <!-- Retta tracciata -->
  <line x1="30" y1="65" x2="130" y2="115" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
</svg>